<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资料库管理｜365营销平台</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#263449;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.top{height:94px;background:linear-gradient(90deg,#27b7d8,#4397f8);display:flex;align-items:stretch;color:#fff}.brand{width:205px;display:flex;align-items:center;padding:0 28px;font-size:20px;font-weight:800}.topnav{display:flex;gap:3px;overflow:auto}.topnav button{border:0;background:transparent;color:#fff;min-width:104px;padding:13px 11px;font-size:13px;font-weight:700;opacity:.86}.topnav button b{display:block;font-size:25px;margin-bottom:5px}.topnav button.active{background:#ffffff24;border-top:4px solid #82f0ff;opacity:1}.user{margin-left:auto;min-width:230px;display:grid;place-items:center;font-size:12px}.shell{display:flex;min-height:calc(100vh - 94px)}.side{width:205px;background:#363653;color:#e1e3ed;padding:20px 0;flex:none}.side a{display:block;padding:14px 22px;font-size:13px;color:inherit;text-decoration:none}.side a.active{background:#464767;color:#fff;border-left:3px solid #36bdec}.main{flex:1;padding:28px 34px}.crumb{font-size:12px;color:#8391a2;margin-bottom:16px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.head h1{font-size:22px;margin:0}.head small{color:#8a96a5}.panel{background:#fff;border:1px solid #e5ebf2;border-radius:12px;box-shadow:0 10px 30px #33415508;padding:19px;margin-bottom:14px}.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.filters label{display:grid;gap:6px;color:#788596;font-size:12px}.filters input,.filters select{height:36px;border:1px solid #dfe5ed;border-radius:6px;padding:0 10px;min-width:150px;color:#344054;background:#fff}.primary{border:0;background:#399de8;color:#fff;padding:9px 18px;border-radius:6px}.ghost{border:1px solid #dce6ee;background:#fff;color:#3d6988;padding:8px 14px;border-radius:6px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #edf0f4;white-space:nowrap}th{color:#778497;background:#f8fafc;font-weight:650}.pill{padding:4px 8px;border-radius:5px;background:#e9f8ef;color:#19835a;font-size:11px}.pill.wait{background:#fff3dd;color:#a87000}.pill.no{background:#ffeded;color:#c84b4b}.link{border:0;background:none;color:#288bc8;padding:3px}.detail{display:none}.detail.open{display:block}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:17px}.preview{background:#f1f5fa;border:1px dashed #cbd8e6;min-height:245px;display:grid;place-items:center;border-radius:10px;color:#789}.kv{display:grid;grid-template-columns:110px 1fr;gap:12px;font-size:13px;margin:12px 0}.kv span:first-child{color:#8994a4}.actions{display:flex;gap:8px;margin-top:22px}.notice{font-size:12px;color:#9a6476;background:#fff5f8;padding:10px;border-radius:6px;margin-top:14px}@media(max-width:800px){.side{display:none}.main{padding:18px}.grid{grid-template-columns:1fr}.user{display:none}}
.lib-thumb{width:46px;height:46px;object-fit:cover;border-radius:7px;display:block}.preview img{width:100%;height:245px;object-fit:cover;border-radius:10px}.config-tabs{display:flex;gap:9px;margin-bottom:14px}.config-tabs button{padding:9px 18px;border:1px solid #d8e3eb;background:#fff;border-radius:7px;color:#567}.config-tabs button.on{background:#eaf5ff;border-color:#83c2ec;color:#208ac9}.rich-toolbar{display:flex;gap:7px;padding:8px;background:#f5f8fb;border:1px solid #dce5ed;border-bottom:0;border-radius:8px 8px 0 0}.rich-toolbar button{min-width:32px;height:30px;background:#fff;border:1px solid #dce4ec;border-radius:5px}.rich-editor{min-height:180px;border:1px solid #dce5ed;border-radius:0 0 8px 8px;padding:15px;outline:0;line-height:1.65;font-size:14px}.config-preview{min-height:70px;background:#f9fbfd;border:1px solid #e5ebf1;border-radius:8px;padding:14px;margin-top:15px;line-height:1.6;font-size:13px}.config-tip{font-size:12px;color:#8896a4;margin:10px 0 18px}
[hidden]{display:none!important}.main{min-width:0}.user{display:flex;justify-content:center;gap:12px}.city-switch{appearance:auto;color:#fff;background:#176abe;border:1px solid #ffffff50;border-radius:5px;padding:5px}.city-switch option{color:#263449;background:#fff}.scope{color:#426481;font-size:13px}.head .scope{margin-left:8px}.field-input{width:100%;height:36px;margin-top:6px;border:1px solid #dfe5ed;border-radius:5px;padding:8px}.table-empty{text-align:center;padding:26px;color:#62738b}.preview video{width:100%;max-height:360px;border-radius:9px}.preview img{height:auto;max-height:360px;object-fit:contain}.rich-editor:focus-visible{outline:2px solid #399de8}
</style></head>
<body>
<header class="top">
  <div class="brand">365营销平台</div>
  <nav class="topnav">
    <button><b>⚙</b>系统管理</button><button><b>▤</b>任务管理</button>
    <button><b>♟</b>活动管理</button><button><b>♧</b>素材管理</button>
    <button><b>▣</b>内容营销</button><button><b>▤</b>课程管理</button>
    <button><b>▣</b>卡券管理</button><button class="active"><b>▦</b>资料库管理</button>
  </nav>
  <div class="user">
    <select id="citySelect" class="city-switch" aria-label="当前工作城市"></select>
    <span>jiangzhongtian</span>
  </div>
</header>
<div class="shell">
  <aside class="side" aria-label="资料库管理">
    <a href="#audit" data-page="audit">待审核素材</a>
    <a href="#library" data-page="library">入库素材</a>
    <a href="#config" data-page="config">说明与须知</a>
  </aside>
  <main class="main">
    <div class="crumb" id="breadcrumb"></div>
    <section id="audit" hidden>
      <div class="head"><h1>待审核素材</h1></div>
      <form class="panel filters" id="auditFilters">
        <label>角色 ID<input name="roleId" placeholder="输入角色 ID"></label>
        <label>姓名<input name="name" placeholder="输入姓名"></label>
        <label>素材类型<select name="type"><option>全部</option><option>图片</option><option>视频</option></select></label>
        <label>上传场景<select name="source"><option>全部</option><option>素材库上传</option><option>会话发送</option></select></label>
        <label>审核状态<select name="status"><option>全部</option><option>待人工审核</option><option>审核通过</option><option>审核未通过</option></select></label>
        <button class="primary">查询</button><button class="ghost" type="reset">重置</button>
      </form>
      <div class="panel tablewrap">
        <table><thead><tr><th>素材预览</th><th>素材名称</th><th>角色 ID</th><th>姓名</th><th>素材类型</th><th>上传场景</th><th>机审结果</th><th>审核状态</th><th>上传时间</th><th>操作</th></tr></thead><tbody id="auditRows"></tbody></table>
      </div>
    </section>
    <section id="library" hidden>
      <div class="head"><h1>入库素材</h1></div>
      <form class="panel filters" id="libraryFilters">
        <label>角色 ID<input name="roleId" placeholder="输入角色 ID"></label>
        <label>素材分类<select name="type"><option>全部</option><option>图片</option><option>视频</option></select></label>
        <button class="primary">查询</button><button class="ghost" type="reset">重置</button>
      </form>
      <div class="panel tablewrap">
        <table><thead><tr><th>素材预览</th><th>素材名称</th><th>角色 ID</th><th>姓名</th><th>素材分类</th><th>上传场景</th><th>上传时间</th><th>使用状态</th><th>操作</th></tr></thead><tbody id="libraryRows"></tbody></table>
      </div>
    </section>
    <section id="config" hidden>
      <div class="head"><h1>说明与须知</h1><span class="scope">对所有城市生效</span></div>
      <div class="config-tabs">
        <button type="button" data-config-kind="help">功能说明</button>
        <button type="button" data-config-kind="notice">素材免责须知</button>
      </div>
      <div class="panel">
        <h3 id="configTitle"></h3>
        <p class="config-tip" id="configTip"></p>
        <div class="rich-toolbar">
          <button type="button" data-format="bold" title="加粗"><b>B</b></button>
          <button type="button" data-format="italic" title="斜体"><i>I</i></button>
          <button type="button" data-format="insertUnorderedList" title="项目符号">☷</button>
          <button type="button" data-format="createLink">链接</button>
        </div>
        <div id="configEditor" class="rich-editor" contenteditable="true" aria-label="富文本内容"></div>
        <div class="actions"><button class="ghost" type="button" id="previewConfig">预览</button><button class="primary" type="button" id="saveConfig">保存</button></div>
        <div class="config-preview" id="configPreview" hidden></div>
      </div>
    </section>
    <section id="detail" hidden>
      <div class="head"><h1 id="detailTitle"></h1><button class="ghost" type="button" id="backToList">返回列表</button></div>
      <div class="grid">
        <div class="panel"><div class="preview" id="detailPreview"></div></div>
        <div class="panel">
          <div id="detailFields"></div>
          <div id="reviewActions" hidden>
            <label>不通过原因<input class="field-input" id="reason" placeholder="填写不通过原因"></label>
            <div class="actions">
              <button class="primary" type="button" data-result="审核通过">人工通过</button>
              <button class="ghost" type="button" data-result="审核未通过">人工不通过</button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="panel" id="unavailable" hidden>当前账号无权访问该页面。</div>
  </main>
</div>
<script src="../report-shared.js"></script>
<script>
const byId = id => document.getElementById(id);
const citySelect = byId('citySelect');
// Standalone prototype permission scenarios: ?profile=city, ?profile=view, ?profile=platform.
const profiles = {
  all: { cities: ['南京', '西安'], reviewCities: ['南京', '西安'], manageCities: ['南京', '西安'], editShared: true },
  city: { cities: ['西安'], reviewCities: ['西安'], manageCities: ['西安'], editShared: false },
  view: { cities: ['西安'], reviewCities: [], manageCities: [], editShared: false },
  platform: { cities: [], reviewCities: [], manageCities: [], editShared: true }
};
const profileKey = new URLSearchParams(location.search).get('profile');
const access = Object.hasOwn(profiles, profileKey) ? profiles[profileKey] : profiles.all;
const pageNames = { audit: '待审核素材', library: '入库素材', config: '说明与须知' };
const assets = [
  { id: 1, city: '南京', roleId: 'B10086', name: '张顾问', type: '图片', source: '会话发送', time: '11-17 09:42', image: 'thumb-community.jpg', machine: '需人工审核', status: '待人工审核' },
  { id: 2, city: '南京', roleId: 'B20415', name: '李顾问', type: '视频', source: '素材库上传', time: '11-17 09:31', image: 'thumb-video.jpg', machine: '不通过', status: '待人工审核' },
  { id: 3, ref: 'asset-1', city: '南京', roleId: 'B10086', name: '张顾问', type: '图片', source: '素材库上传', time: '11-17 09:42', image: 'thumb-living.jpg', machine: '通过', status: '审核通过' },
  { id: 4, ref: 'asset-2', city: '南京', roleId: 'B10086', name: '张顾问', type: '视频', source: '会话发送', time: '11-17 09:31', image: 'thumb-video.jpg', machine: '通过', status: '审核通过' },
  { id: 5, ref: 'asset-5', city: '南京', roleId: 'B10086', name: '张顾问', type: '图片', source: '素材库上传', time: '11-16 16:06', image: 'thumb-community.jpg', machine: '通过', status: '审核通过' },
  { id: 6, city: '西安', roleId: 'B30021', name: '王顾问', type: '图片', source: '素材库上传', time: '11-17 10:18', image: 'thumb-skyline.jpg', machine: '不通过', status: '待人工审核' },
  { id: 7, city: '西安', roleId: 'B30021', name: '王顾问', type: '图片', source: '素材库上传', time: '11-17 09:23', image: 'thumb-community.jpg', machine: '通过', status: '审核通过' },
  { id: 8, ref: 'asset-6', city: '南京', roleId: 'B10086', name: '张顾问', type: '视频', source: '素材库上传', time: '11-15 14:25', image: 'thumb-skyline.jpg', machine: '通过', status: '审核通过' }
];
const search = { audit: {}, library: {} };
let currentPage;
let currentAsset;

function canUse(page) {
  return page === 'config' ? access.editShared : access.cities.includes(citySelect.value);
}
function canReview(asset) {
  return asset.city === citySelect.value && access.reviewCities.includes(asset.city)
    && asset.status === '待人工审核';
}
function canManageAvailability(asset) {
  return canUse('library') && asset.city === citySelect.value
    && access.manageCities.includes(asset.city) && asset.status === '审核通过';
}
function assetRef(asset) { return asset.ref || 'admin-asset-' + asset.id; }
function usageStatus(asset) { return ReportPrototype.isDisabled(assetRef(asset)) ? '已禁用' : '可用'; }
function toggleAvailability(asset) {
  if (currentPage !== 'library' || !canManageAvailability(asset)) return;
  const disable = !ReportPrototype.isDisabled(assetRef(asset));
  const message = disable
    ? '禁用后，经纪人无法选择此素材，客户报告也会隐藏此素材。确定禁用？'
    : '恢复后，经纪人可再次选择此素材，引用它的报告将重新展示。确定恢复？';
  if (!confirm(message)) return;
  if (!ReportPrototype.setDisabled(assetRef(asset), disable)) {
    alert('操作未完成，请重试');
    return;
  }
  renderList('library');
}
function assetName(asset) {
  const [date, time] = asset.time.split(' ');
  const [month, day] = date.split('-');
  return asset.type + ' · ' + Number(month) + '月' + Number(day) + '日 ' + time;
}
function make(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text) el.textContent = text;
  return el;
}

function renderList(page) {
  const rows = byId(page + 'Rows');
  rows.replaceChildren();
  if (!canUse(page)) return;

  const criteria = search[page];
  const records = assets.filter(asset =>
    asset.city === citySelect.value &&
    (page !== 'library' || asset.status === '审核通过') &&
    (!criteria.roleId || asset.roleId === criteria.roleId.toUpperCase()) &&
    (!criteria.name || asset.name.includes(criteria.name)) &&
    ['type', 'source', 'status'].every(field =>
      !criteria[field] || criteria[field] === '全部' || asset[field] === criteria[field])
  );
  if (page === 'audit') {
    records.sort((a, b) => Number(b.status === '待人工审核') - Number(a.status === '待人工审核'));
  }
  if (!records.length) {
    const empty = make('td', 'table-empty', '暂无符合条件的素材');
    empty.colSpan = page === 'audit' ? 10 : 9;
    rows.insertRow().append(empty);
    return;
  }

  for (const asset of records) {
    const row = rows.insertRow();
    const img = make('img', 'lib-thumb');
    img.src = '../有客App/' + asset.image;
    img.alt = '素材预览';
    row.insertCell().append(img);
    for (const value of [assetName(asset), asset.roleId, asset.name, asset.type, asset.source]) {
      row.insertCell().textContent = value;
    }
    if (page === 'audit') row.insertCell().textContent = asset.machine;
    if (page === 'library') row.insertCell().textContent = asset.time;
    const status = page === 'library' ? usageStatus(asset) : asset.status;
    const tone = ['可用', '审核通过'].includes(status) ? '' : ['已禁用', '审核未通过'].includes(status) ? ' no' : ' wait';
    row.insertCell().append(make('span', 'pill' + tone, status));
    if (page === 'audit') row.insertCell().textContent = asset.time;
    const view = make('button', 'link', page === 'audit' && canReview(asset) ? '审核' : '查看');
    view.addEventListener('click', () => openDetail(asset.id));
    const actions = row.insertCell();
    actions.append(view);
    if (page === 'library' && canManageAvailability(asset)) {
      const toggle = make('button', 'link', status === '已禁用' ? '恢复' : '禁用');
      toggle.style.marginLeft = '12px';
      toggle.addEventListener('click', () => toggleAvailability(asset));
      actions.append(toggle);
    }
  }
}

function showPage(page) {
  currentPage = page;
  currentAsset = null;
  byId('detail').hidden = true;
  byId('unavailable').hidden = canUse(page);
  for (const link of document.querySelectorAll('[data-page]')) {
    const value = link.dataset.page;
    link.hidden = !canUse(value);
    link.classList.toggle('active', value === page);
    byId(value).hidden = value !== page || !canUse(value);
  }
  byId('breadcrumb').textContent = '营销平台系统 / 资料库管理 / ' + pageNames[page];
  if (!canUse(page)) return;
  if (page === 'config') switchConfig(configKind);
  else renderList(page);
}

function openDetail(id) {
  if (!['audit', 'library'].includes(currentPage) || !canUse(currentPage)) return;
  const asset = assets.find(item => item.id === id && item.city === citySelect.value);
  if (!asset || (currentPage === 'library' && asset.status !== '审核通过')) return;
  currentAsset = asset;
  byId(currentPage).hidden = true;
  byId('detail').hidden = false;
  byId('detailTitle').textContent = currentPage === 'library' ? '入库素材详情' : '素材详情';
  const preview = make(asset.type === '视频' ? 'video' : 'img');
  const imageUrl = '../有客App/' + asset.image;
  if (asset.type === '视频') {
    preview.poster = imageUrl;
    preview.src = '../微信淘房小程序/报告视频示例.mp4';
    preview.controls = true;
  } else {
    preview.src = imageUrl;
    preview.alt = '素材预览';
  }
  byId('detailPreview').replaceChildren(preview);
  const fields = [
    ['素材名称', assetName(asset)], ['角色 ID', asset.roleId], ['姓名', asset.name],
    ['素材类型', asset.type], ['上传场景', asset.source], ['上传时间', asset.time]
  ];
  if (currentPage === 'library') {
    fields.push(['使用状态', usageStatus(asset)]);
  } else {
    fields.push(['机审结果', asset.machine], ['审核状态', asset.status]);
    if (asset.manual) fields.push(['人工审核结果', asset.manual]);
    if (asset.reason) fields.push(['不通过原因', asset.reason]);
  }
  byId('detailFields').replaceChildren(...fields.map(([label, value]) => {
    const row = make('div', 'kv');
    row.append(make('span', '', label), make('b', '', value));
    return row;
  }));
  byId('reason').value = '';
  byId('reason').setCustomValidity('');
  byId('reviewActions').hidden = currentPage !== 'audit' || !canReview(asset);
}

function decide(result) {
  const asset = currentAsset;
  if (currentPage !== 'audit' || !asset || !canReview(asset)) return;
  const reasonInput = byId('reason');
  const reason = reasonInput.value.trim();
  if (result === '审核未通过' && !reason) {
    reasonInput.setCustomValidity('请填写不通过原因');
    reasonInput.reportValidity();
    return;
  }
  if (!confirm(result === '审核通过' ? '确认人工审核通过？' : '确认人工审核不通过？')) return;
  asset.status = result;
  asset.manual = result;
  asset.reason = result === '审核未通过' ? reason : '';
  openDetail(asset.id);
}

const configDefaults = {
  help: '<p>常用的房源照片、讲解视频，可以先放进「我的素材」。审核通过后，组报告时随时能用。</p><p>在「我的报告」整理好客户关心的内容，和客户聊天时，从「发送资料」挑素材或报告发给他。</p>',
  notice: '<p>请确认上传内容真实、合法且具有使用权。平台会进行内容审核。审核通过不代表对素材真实性作出保证。</p>'
};
let configKind = 'help';
const configDrafts = {};

function safeRich(html) {
  const template = document.createElement('template');
  template.innerHTML = html;
  const allowed = new Set(['P', 'DIV', 'BR', 'B', 'STRONG', 'I', 'EM', 'UL', 'OL', 'LI', 'A']);
  const walk = node => {
    for (const child of [...node.children]) {
      if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'SVG'].includes(child.tagName)) {
        child.remove();
        continue;
      }
      walk(child);
      if (!allowed.has(child.tagName)) {
        child.replaceWith(...child.childNodes);
        continue;
      }
      const href = child.tagName === 'A' ? child.getAttribute('href') : null;
      for (const attr of [...child.attributes]) child.removeAttribute(attr.name);
      if (href && /^https?:\/\//i.test(href)) {
        child.setAttribute('href', href);
        child.setAttribute('target', '_blank');
        child.setAttribute('rel', 'noopener noreferrer');
      }
    }
  };
  walk(template.content);
  return template.innerHTML;
}

function configKey(kind) { return 'smallb-config-' + kind; }

function switchConfig(kind) {
  if (!canUse('config')) return;
  configKind = kind;
  for (const tab of document.querySelectorAll('[data-config-kind]')) {
    tab.classList.toggle('on', tab.dataset.configKind === kind);
  }
  const isHelp = kind === 'help';
  byId('configTitle').textContent = isHelp ? '功能说明' : '365有客App素材免责须知';
  byId('configTip').textContent = isHelp
    ? '经纪人在有客 App 的资料库查看。'
    : '经纪人在组装报告页查看。';
  let saved = configDefaults[kind];
  try { saved = localStorage.getItem(configKey(kind)) || saved; } catch {}
  byId('configEditor').innerHTML = safeRich(configDrafts[kind] ?? saved);
  byId('configPreview').hidden = true;
}

function previewConfig() {
  if (currentPage !== 'config' || !canUse('config')) return;
  byId('configPreview').innerHTML = safeRich(byId('configEditor').innerHTML);
  byId('configPreview').hidden = false;
}

for (const city of access.cities) citySelect.add(new Option(city, city));
citySelect.hidden = !access.cities.length;
citySelect.addEventListener('change', () => {
  for (const page of ['audit', 'library']) {
    byId(page + 'Filters').reset();
    search[page] = {};
  }
  if (currentPage !== 'config') showPage(currentPage);
});

for (const page of ['audit', 'library']) {
  const form = byId(page + 'Filters');
  form.addEventListener('submit', event => {
    event.preventDefault();
    search[page] = Object.fromEntries([...new FormData(form)].map(([key, value]) => [key, value.trim()]));
    renderList(page);
  });
  form.addEventListener('reset', () => {
    search[page] = {};
    renderList(page);
  });
}
byId('backToList').addEventListener('click', () => showPage(currentPage));
byId('reason').addEventListener('input', event => event.target.setCustomValidity(''));
for (const button of document.querySelectorAll('[data-result]')) {
  button.addEventListener('click', () => decide(button.dataset.result));
}
for (const button of document.querySelectorAll('[data-config-kind]')) {
  button.addEventListener('click', () => switchConfig(button.dataset.configKind));
}
for (const button of document.querySelectorAll('[data-format]')) {
  button.addEventListener('mousedown', event => event.preventDefault());
  button.addEventListener('click', () => {
    if (currentPage !== 'config' || !canUse('config')) return;
    const command = button.dataset.format;
    byId('configEditor').focus();
    const value = command === 'createLink' ? prompt('输入链接地址') : null;
    if (command === 'createLink' && !/^https?:\/\//i.test(value || '')) return;
    document.execCommand(command, false, value);
  });
}
byId('configEditor').addEventListener('input', event => {
  if (currentPage === 'config' && canUse('config')) configDrafts[configKind] = event.target.innerHTML;
});
byId('previewConfig').addEventListener('click', previewConfig);
byId('saveConfig').addEventListener('click', () => {
  if (currentPage !== 'config' || !canUse('config')) return;
  const html = safeRich(byId('configEditor').innerHTML);
  const template = document.createElement('template');
  template.innerHTML = html;
  if (!template.content.textContent.trim()) {
    alert('请填写内容');
    return;
  }
  try {
    localStorage.setItem(configKey(configKind), html);
    delete configDrafts[configKind];
    byId('configEditor').innerHTML = html;
    previewConfig();
    alert('已保存，对所有城市生效');
  } catch {
    alert('保存失败，请重试');
  }
});

function route() {
  const requested = location.hash.slice(1);
  showPage(Object.hasOwn(pageNames, requested) ? requested : access.cities.length ? 'audit' : 'config');
}
window.addEventListener('hashchange', route);
ReportPrototype.onAvailabilityChange(() => {
  if (currentPage !== 'library') return;
  if (currentAsset) openDetail(currentAsset.id);
  else renderList('library');
});
route();
</script>
</body></html>
