<body>
<header class="top">
  <div class="brand">365营销平台</div>
  <nav class="topnav">
    <button><b>⚙</b>系统管理</button><button><b>▤</b>任务管理</button>
    <button><b>♟</b>活动管理</button><button><b>♧</b>素材管理</button>
    <button><b>▣</b>内容营销</button><button><b>▤</b>课程管理</button>
    <button><b>▣</b>卡券管理</button><button class="active"><b>▦</b>资料库管理</button>
  </nav>
  <div class="user">
    <select id="citySelect" class="city-switch" aria-label="当前工作城市"></select>
    <span>jiangzhongtian</span>
  </div>
</header>
<div class="shell">
  <aside class="side" aria-label="资料库管理">
    <a href="#library" data-page="library">素材管理</a>
    <a href="#reports" data-page="reports">报告管理</a>
    <a href="#config" data-page="config">说明与须知</a>
    <button type="button" id="prototypeReset" class="ghost" style="margin:18px 12px;width:calc(100% - 24px)">重置资料库演示</button>
  </aside>
  <main class="main">
    <div class="crumb" id="breadcrumb"></div>
    <section id="library" hidden>
      <div class="head"><h1>素材管理</h1></div>
      <form class="panel filters" id="libraryFilters">
        <label>角色 ID<input name="roleId" placeholder="输入角色 ID"></label>
        <label>素材分类<select name="type"><option>全部</option><option>图片</option><option>视频</option></select></label>
        <button class="primary">查询</button><button class="ghost" type="reset">重置</button>
      </form>
      <div class="panel tablewrap">
        <table><thead><tr><th>素材预览</th><th>素材名称</th><th>角色 ID</th><th>姓名</th><th>素材分类</th><th>上传场景</th><th>上传时间</th><th>使用状态</th><th>操作</th></tr></thead><tbody id="libraryRows"></tbody></table>
      </div>
    </section>
    <section id="reports" hidden>
      <div class="head"><h1>报告管理</h1></div>
      <form class="panel filters" id="reportsFilters">
        <label>报告名称<input name="title" placeholder="输入报告名称"></label>
        <label>角色 ID<input name="roleId" placeholder="输入角色 ID"></label>
        <label>编辑人<input name="editor" placeholder="输入姓名"></label>
        <button class="primary">查询</button><button class="ghost" type="reset">重置</button>
      </form>
      <div class="panel tablewrap">
        <table><thead><tr><th>报告名称</th><th>角色 ID</th><th>编辑人</th><th>最近编辑时间</th><th>报告状态</th><th>操作</th></tr></thead><tbody id="reportsRows"></tbody></table>
      </div>
    </section>
    <section id="sentReports" hidden>
      <div class="head"><h1 id="sentReportsTitle">发送记录</h1><button class="ghost" type="button" id="backFromSentReports">返回报告列表</button></div>
      <div class="panel tablewrap"><table><thead><tr><th>发送时间</th><th>接收用户 788 ID</th><th>查看状态</th><th>操作</th></tr></thead><tbody id="sentReportRows"></tbody></table></div>
    </section>
    <section id="config" hidden>
      <div class="head"><h1>说明与须知</h1><span class="scope">对所有城市生效</span></div>
      <div class="config-tabs">
        <button type="button" data-config-kind="help">功能说明</button>
        <button type="button" data-config-kind="notice">素材免责须知</button>
      </div>
      <div class="panel">
        <h3 id="configTitle"></h3>
        <p class="config-tip" id="configTip"></p>
        <div class="rich-toolbar">
          <button type="button" data-format="bold" title="加粗"><b>B</b></button>
          <button type="button" data-format="italic" title="斜体"><i>I</i></button>
          <button type="button" data-format="insertUnorderedList" title="项目符号">☷</button>
          <button type="button" data-format="createLink">链接</button>
        </div>
        <div id="configEditor" class="rich-editor" contenteditable="true" aria-label="富文本内容"></div>
        <div class="actions"><button class="ghost" type="button" id="previewConfig">预览</button><button class="primary" type="button" id="saveConfig">保存</button></div>
        <div class="config-preview" id="configPreview" hidden></div>
      </div>
    </section>
    <section id="detail" hidden>
      <div class="head"><h1 id="detailTitle"></h1><button class="ghost" type="button" id="backToList">返回列表</button></div>
      <div class="grid">
        <div class="panel"><div class="preview" id="detailPreview"></div></div>
        <div class="panel">
          <div id="detailFields"></div>
        </div>
      </div>
    </section>
    <div class="panel" id="unavailable" hidden>当前账号无权访问该页面。</div>
  </main>
</div>
<dialog id="availabilityDialog" class="availability-dialog"><form id="availabilityForm" method="dialog"><h2 id="availabilityTitle"></h2><p id="availabilityImpact"></p><label id="availabilityReasonLabel">禁用原因<textarea id="availabilityReason" maxlength="200" placeholder="请简要说明处理原因"></textarea></label><div class="error" id="availabilityError" role="alert"></div><div class="actions"><button class="ghost" type="button" id="availabilityCancel">取消</button><button class="primary" type="submit" id="availabilitySubmit">确认禁用</button></div></form></dialog>
<dialog id="historyDialog" class="availability-dialog"><div class="dialog-body"><h2 id="historyTitle">操作记录</h2><div id="historyList" class="history-list"></div><div class="actions"><button class="ghost" type="button" id="historyClose">关闭</button></div></div></dialog>
<dialog id="qrDialog" class="availability-dialog qr-dialog"><div class="dialog-body"><h2 id="qrTitle">淘房小程序码</h2><img id="qrImage" alt="淘房小程序码演示图"><p id="qrTip"></p><div class="actions"><button class="ghost" type="button" id="qrClose">关闭</button></div></div></dialog>
<script src="../report-shared.js"></script>
<script>
const byId = id => document.getElementById(id);
const citySelect = byId('citySelect');
// Standalone prototype permission scenarios: ?profile=city, ?profile=view, ?profile=platform.
const profiles = {
  all: { cities: ['南京', '西安'], manageCities: ['南京', '西安'], reportCities: ['南京', '西安'], editShared: true },
  city: { cities: ['西安'], manageCities: ['西安'], reportCities: ['西安'], editShared: false },
  view: { cities: ['西安'], manageCities: [], reportCities: [], editShared: false },
  platform: { cities: [], manageCities: [], reportCities: [], editShared: true }
};
const profileKey = new URLSearchParams(location.search).get('profile');
const access = Object.hasOwn(profiles, profileKey) ? profiles[profileKey] : profiles.all;
const pageNames = { library: '素材管理', reports: '报告管理', config: '说明与须知' };
const assets = [
  {id:1,ref:'asset-3',city:'南京',roleId:'B10086',name:'张顾问',type:'图片',source:'素材库上传',time:'11-17 08:02',image:'thumb-community.jpg'},
  {id:2,city:'南京',roleId:'B20415',name:'李顾问',type:'视频',source:'素材库上传',time:'11-17 09:31',image:'thumb-video.jpg'},
  {id:3,ref:'asset-1',city:'南京',roleId:'B10086',name:'张顾问',type:'图片',source:'素材库上传',time:'11-17 09:42',image:'thumb-living.jpg'},
  {id:4,ref:'asset-2',city:'南京',roleId:'B10086',name:'张顾问',type:'视频',source:'会话发送',time:'11-17 09:31',image:'thumb-video.jpg'},
  {id:5,ref:'asset-5',city:'南京',roleId:'B10086',name:'张顾问',type:'图片',source:'素材库上传',time:'11-16 16:06',image:'thumb-community.jpg'},
  {id:6,city:'西安',roleId:'B30021',name:'王顾问',type:'图片',source:'素材库上传',time:'11-17 10:18',image:'thumb-skyline.jpg'},
  {id:7,city:'西安',roleId:'B30021',name:'王顾问',type:'图片',source:'素材库上传',time:'11-17 09:23',image:'thumb-community.jpg'},
  {id:8,ref:'asset-6',city:'南京',roleId:'B10086',name:'张顾问',type:'视频',source:'素材库上传',time:'11-15 14:25',image:'thumb-skyline.jpg'},
  {id:9,ref:'asset-4',city:'南京',roleId:'B10086',name:'张顾问',type:'图片',source:'会话发送',time:'11-16 17:20',image:'thumb-skyline.jpg'}
];
const reports = [
  { id: 'R001', city: '南京', roleId: 'B10086', editor: '张顾问', title: '周末看房实景照片', createdAt: '2026-11-15 10:20', updatedAt: '2026-11-17 10:18', floors: [{title:'实景照片',count:2}], qr: 'qr-report-nanjing.png' },
  { id: 'R002', city: '西安', roleId: 'B30021', editor: '王顾问', title: '西安三房看房参考', createdAt: '2026-11-16 16:00', updatedAt: '2026-11-17 10:38', floors: [{title:'房源推荐',count:2},{title:'实景照片',count:2},{title:'实拍视频',count:1}], qr: 'qr-report-xian.png' },
  { id: 'R003', city: '南京', roleId: 'B10086', editor: '张顾问', title: '周末现场讲解视频', createdAt: '2026-11-17 09:40', updatedAt: '2026-11-17 09:52', floors: [{title:'实拍视频',count:2}], qr: 'qr-report-video.png' }
];
try {
  if(localStorage.getItem('smallb-admin-availability-example-seeded')!=='1'){
    ReportPrototype.setDisabled('asset-6',true);
    const disabledReports=new Set(JSON.parse(localStorage.getItem('demo-disabled-reports')||'[]'));
    disabledReports.add('R002');
    localStorage.setItem('demo-disabled-reports',JSON.stringify([...disabledReports]));
    const history=JSON.parse(localStorage.getItem('demo-availability-actions')||'[]');
    if(!history.some(item=>item.kind==='素材'&&item.id==='asset-6'))history.push({kind:'素材',id:'asset-6',action:'禁用',reason:'演示素材：不适合继续展示',operator:'演示运营',time:'2026-11-17T10:30:00+08:00'});
    if(!history.some(item=>item.kind==='报告'&&item.id==='R002'))history.push({kind:'报告',id:'R002',action:'禁用',reason:'演示报告：暂停展示',operator:'演示运营',time:'2026-11-17T10:35:00+08:00'});
    localStorage.setItem('demo-availability-actions',JSON.stringify(history));
    localStorage.setItem('smallb-admin-availability-example-seeded','1');
  }
} catch {}
const search = { library: {}, reports: {} };
let activeReportId=null;
const reportDisabled=new Set(JSON.parse(localStorage.getItem('demo-disabled-reports')||'[]'));

const sentReports=[{id:'S001',reportId:'R001',city:'南京',roleId:'B10086',name:'张顾问',title:'周末看房实景照片',time:'11-17 11:20',recipient788Id:'78810031'},{id:'S002',reportId:'R002',city:'西安',roleId:'B30021',name:'王顾问',title:'西安三房看房参考',time:'11-17 11:45',recipient788Id:'78820418'},{id:'S003',reportId:'R003',city:'南京',roleId:'B10086',name:'张顾问',title:'周末现场讲解视频',time:'11-17 12:00',recipient788Id:'78830912',deleted:true}];
function persistReportStates(){localStorage.setItem('demo-disabled-reports',JSON.stringify([...reportDisabled]))}

byId('prototypeReset').onclick=()=>{if(!confirm('重置资料库演示数据？'))return;for(const key of Object.keys(localStorage)){if(key.startsWith('demo-')||key.startsWith('smallb-')||key.startsWith('youke-assets-'))localStorage.removeItem(key)}location.reload()};
let currentPage;
let currentAsset;

function canUse(page) {
  return page === 'config' ? access.editShared : (page === 'reports' || page === 'sentReports')
    ? access.reportCities.includes(citySelect.value) : access.cities.includes(citySelect.value);
}
function canManageAvailability(asset) {
  return canUse('library') && asset.city === citySelect.value
    && access.manageCities.includes(asset.city);
}
function assetRef(asset) { return asset.ref || 'admin-asset-' + asset.id; }
function recordAvailabilityAction(kind,id,action,reason='') { const key='demo-availability-actions';const records=JSON.parse(localStorage.getItem(key)||'[]');records.unshift({kind,id,action,reason,operator:'jiangzhongtian',time:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(records)); }
function openActionHistory(kind,id) {
  const records=JSON.parse(localStorage.getItem('demo-availability-actions')||'[]').filter(item=>item.kind===kind&&item.id===id);
  byId('historyTitle').textContent=kind+'操作记录';
  const list=byId('historyList');list.replaceChildren();
  if(!records.length) list.append(make('p','','暂无操作记录'));
  for(const record of records){
    const item=make('div','action-history-item');
    item.append(make('b','',record.action),make('small','',record.operator+' · '+new Date(record.time).toLocaleString('zh-CN')));
    if(record.reason)item.append(make('p','','原因：'+record.reason));
    list.append(item);
  }
  byId('historyDialog').showModal();
}
let pendingAvailabilityAction=null;
function openAvailabilityDialog({kind,disabling,impact,onConfirm}){
  byId('availabilityTitle').textContent=(disabling?'禁用':'恢复')+kind;
  byId('availabilityImpact').textContent=impact;
  byId('availabilityReasonLabel').hidden=!disabling;
  byId('availabilityReason').value='';
  byId('availabilityError').textContent='';
  byId('availabilitySubmit').textContent='确认'+(disabling?'禁用':'恢复');
  pendingAvailabilityAction={disabling,onConfirm};
  byId('availabilityDialog').showModal();
  if(disabling)byId('availabilityReason').focus();
}
byId('availabilityCancel').onclick=()=>byId('availabilityDialog').close();
byId('availabilityForm').onsubmit=event=>{
  event.preventDefault();
  const reason=byId('availabilityReason').value.trim();
  if(pendingAvailabilityAction?.disabling&&!reason){byId('availabilityError').textContent='请填写禁用原因';byId('availabilityReason').focus();return}
  const action=pendingAvailabilityAction;byId('availabilityDialog').close();pendingAvailabilityAction=null;action?.onConfirm(reason);
};
byId('historyClose').onclick=()=>byId('historyDialog').close();
byId('qrClose').onclick=()=>byId('qrDialog').close();
function usageStatus(asset) { const deleted=ReportPrototype.isDeleted(assetRef(asset)),disabled=ReportPrototype.isDisabled(assetRef(asset));return deleted?(disabled?'安家顾问已删除 · 已禁用':'安家顾问已删除'):disabled?'已禁用':'可用'; }
function toggleAvailability(asset) {
  if (currentPage !== 'library' || !canManageAvailability(asset)) return;
  const disable = !ReportPrototype.isDisabled(assetRef(asset));
  const deleted=ReportPrototype.isDeleted(assetRef(asset));
  const impact = disable
    ? deleted?'历史报告将隐藏此素材。安家顾问已删除状态保持不变。':'安家顾问将无法选择此素材，历史报告也会隐藏此素材。'
    : deleted?'历史报告可重新展示此素材。安家顾问已删除状态保持不变。':'安家顾问可再次选择此素材，引用它的报告将重新展示。';
  openAvailabilityDialog({kind:'素材',disabling:disable,impact,onConfirm:reason=>{
    if (!ReportPrototype.setDisabled(assetRef(asset), disable)) {alert('操作未完成，请重试');return}
    recordAvailabilityAction('素材',assetRef(asset),disable?'禁用':'恢复',reason);
    renderList('library');
  }});
}
function assetName(asset) {
  const [date, time] = asset.time.split(' ');
  const [month, day] = date.split('-');
  return asset.type + ' · ' + Number(month) + '月' + Number(day) + '日 ' + time;
}
function originalFileInfo(asset) {
  return ReportPrototype.getMetadata(assetRef(asset)) || {
    fileName: (asset.type === '视频' ? 'VID_' : 'IMG_') + String(asset.id).padStart(4, '0') + (asset.type === '视频' ? '.MOV' : '.JPG'),
    format: asset.type === '视频' ? 'MOV' : 'JPEG',
    size: asset.type === '视频' ? '28.4 MB' : '3.8 MB',
    resolution: asset.type === '视频' ? '1920 × 1080' : '3024 × 4032',
    duration: asset.type === '视频' ? '00:18' : undefined,
    capturedAt: '未记录', device: '未记录', location: asset.ref==='asset-1'?'32.0462, 118.7781':'未记录'
  };
}
function make(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text) el.textContent = text;
  return el;
}

function renderList(page) {
  if(page==='reports'){renderReports();return}if(page==='sentReports'){renderSentReports();return}
  const rows=byId('libraryRows');rows.replaceChildren();
  if(!canUse('library'))return;
  const criteria=search.library;
  const records=assets.filter(asset=>asset.city===citySelect.value
    &&(!criteria.roleId||asset.roleId===criteria.roleId.toUpperCase())
    &&(!criteria.name||asset.name.includes(criteria.name))
    &&(!criteria.type||criteria.type==='全部'||asset.type===criteria.type)
    &&(!criteria.source||criteria.source==='全部'||asset.source===criteria.source));
  if(!records.length){const empty=make('td','table-empty','暂无符合条件的素材');empty.colSpan=9;rows.insertRow().append(empty);return}
  for(const asset of records){
    const row=rows.insertRow();const img=make('img','lib-thumb');img.src='../有客App/'+asset.image;img.alt='素材预览';row.insertCell().append(img);
    for(const value of [assetName(asset),asset.roleId,asset.name,asset.type,asset.source,asset.time])row.insertCell().textContent=value;
    const status=usageStatus(asset);row.insertCell().append(make('span','pill'+(status==='可用'?'':' no'),status));
    const actions=row.insertCell();const view=make('button','link','查看');view.addEventListener('click',()=>openDetail(asset.id));actions.append(view);
    const history=make('button','link','操作记录');history.style.marginLeft='12px';history.onclick=()=>openActionHistory('素材',assetRef(asset));actions.append(history);
    if(canManageAvailability(asset)){const toggle=make('button','link',ReportPrototype.isDisabled(assetRef(asset))?'恢复':'禁用');toggle.style.marginLeft='12px';toggle.addEventListener('click',()=>toggleAvailability(asset));actions.append(toggle)}
  }
}
function renderReports() {
  const rows = byId('reportsRows');
  rows.replaceChildren();
  if (!canUse('reports')) return;
  const criteria = search.reports;
  const visible = reports.filter(report => report.city === citySelect.value
    && (!criteria.title || report.title.includes(criteria.title))
    && (!criteria.roleId || report.roleId === criteria.roleId.toUpperCase())
    && (!criteria.editor || report.editor.includes(criteria.editor)))
    .sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
  if (!visible.length) {
    const empty = make('td', 'table-empty', '暂无符合条件的报告');
    empty.colSpan = 6;
    rows.insertRow().append(empty);
    return;
  }
  for (const report of visible) {
    const row = rows.insertRow();
    row.insertCell().append(make('span', 'report-name', report.title));
    for (const value of [report.roleId, report.editor]) row.insertCell().textContent = value;
        row.insertCell().textContent = report.updatedAt;
    row.insertCell().textContent=reportDisabled.has(report.id)?'已禁用':sentReports.some(x=>x.reportId===report.id&&x.deleted)?'安家顾问已删除':'可用';
    const view = make('button', 'link', '查看');
    view.addEventListener('click', () => openReportDetail(report.id));
    const actions=row.insertCell();actions.append(view);
    const history=make('button','link','发送记录');history.style.marginLeft='12px';history.onclick=()=>{activeReportId=report.id;byId('reports').hidden=true;openSentRecords()};actions.append(history);
    const actionLog=make('button','link','操作记录');actionLog.style.marginLeft='12px';actionLog.onclick=()=>openActionHistory('报告',report.id);actions.append(actionLog);
    if(!sentReports.some(x=>x.reportId===report.id&&x.deleted)){const toggle=make('button','link',reportDisabled.has(report.id)?'恢复':'禁用');toggle.style.marginLeft='12px';toggle.onclick=()=>{const disabling=!reportDisabled.has(report.id);openAvailabilityDialog({kind:'报告',disabling,impact:disabling?'安家顾问端将显示不可用占位，所有历史快照不可查看。':'报告将恢复可用；所属快照重新可查看。',onConfirm:reason=>{disabling?reportDisabled.add(report.id):reportDisabled.delete(report.id);recordAvailabilityAction('报告',report.id,disabling?'禁用':'恢复',reason);persistReportStates();renderReports()}})};actions.append(toggle)}
  }
}

function openSentRecords(){const report=reports.find(x=>x.id===activeReportId&&x.city===citySelect.value);if(!report)return;byId('sentReports').hidden=false;byId('sentReportsTitle').textContent='发送记录 · '+report.title;byId('breadcrumb').textContent='营销平台系统 / 资料库管理 / 报告管理 / '+report.title+' / 发送记录';renderSentReports()}
function renderSentReports(){
  const rows=byId('sentReportRows');rows.replaceChildren();
  if(!activeReportId||!canUse('sentReports'))return;
  const records=sentReports.filter(x=>x.city===citySelect.value&&x.reportId===activeReportId).sort((a,b)=>b.time.localeCompare(a.time));
  if(!records.length){const cell=rows.insertRow().insertCell();cell.colSpan=4;cell.textContent='暂无发送记录';return}
  for(const record of records){
    const row=rows.insertRow();
    row.insertCell().textContent=record.time;
    row.insertCell().textContent=record.recipient788Id;
    const parentDisabled=reportDisabled.has(record.reportId);
    row.insertCell().textContent=parentDisabled?'随报告禁用':'可用';
    const op=row.insertCell();
    const view=make('button','link','查看');view.onclick=()=>openSnapshotDetail(record);op.append(view);
  }
}
const sampleMediaRefs={R001:['asset-1','asset-5'],R002:['asset-1','asset-5','asset-2'],R003:['asset-2','asset-6']};
function reportSampleUrl(id,disabled=false){const url=new URL('https://jzt-ai.github.io/365-taofang-exclusive-report/report/');url.searchParams.set('sample',id);if(disabled)url.searchParams.set('disabled','1');else {const refs=(sampleMediaRefs[id]||[]).filter(ref=>ReportPrototype.isDisabled(ref));if(refs.length)url.searchParams.set('disabledAssets',refs.join(','))}return url.href}
function reportSampleQr(report,disabled=false){if(disabled)return 'qr-report-unavailable.png';if(report.id==='R003'&&ReportPrototype.isDisabled('asset-6'))return 'qr-report-video-disabled-asset.png';return report.qr}
function openSnapshotDetail(record){const disabled=reportDisabled.has(record.reportId),report=reports.find(x=>x.id===record.reportId);openQrDialog({title:'历史报告小程序码',image:reportSampleQr(report||{id:record.reportId,qr:'qr-report-xian.png'},disabled),tip:disabled?'扫码可查看客户所见的暂不可查看页面':'扫码查看本次发送的历史客户页',url:reportSampleUrl(record.reportId,disabled)})}
byId('backFromSentReports').onclick=()=>showPage('reports');
function openQrDialog({title,image,tip,url}){byId('qrTitle').textContent=title;byId('qrImage').hidden=!image;byId('qrImage').src=image;byId('qrTip').textContent=tip;byId('qrDialog').showModal()}
function openReportDetail(id) {
  if (currentPage !== 'reports' || !canUse('reports')) return;
  const report = reports.find(item => item.id === id && item.city === citySelect.value);
  if (!report) return;
  const deleted=sentReports.some(x=>x.reportId===report.id&&x.deleted);
  openQrDialog({title:report.title,image:deleted?'':reportSampleQr(report,reportDisabled.has(report.id)),tip:deleted?'当前报告已被安家顾问删除。可从「发送记录」查看历史快照。':'扫码查看客户所见的报告页面',url:deleted?'':reportSampleUrl(report.id,reportDisabled.has(report.id))});
  byId('qrImage').hidden=deleted;
}

function showPage(page) {
  currentPage = page;
  currentAsset = null;
  byId('detail').hidden = true;
  byId('sentReports').hidden = true;
  byId('unavailable').hidden = canUse(page);
  for (const link of document.querySelectorAll('[data-page]')) {
    const value = link.dataset.page;
    link.hidden = !canUse(value);
    link.classList.toggle('active', value === page);
    byId(value).hidden = value !== page || !canUse(value);
  }
  byId('breadcrumb').textContent = '营销平台系统 / 资料库管理 / ' + pageNames[page];
  if (!canUse(page)) return;
  if (page === 'config') switchConfig(configKind);
  else renderList(page);
}

function openDetail(id) {
  if(currentPage!=='library'||!canUse('library'))return;
  const asset=assets.find(item=>item.id===id&&item.city===citySelect.value);if(!asset)return;
  currentAsset=asset;byId('library').hidden=true;byId('detail').hidden=false;byId('detailTitle').textContent='素材详情';
  const preview=make(asset.type==='视频'?'video':'img');const imageUrl='../有客App/'+asset.image;
  if(asset.type==='视频'){preview.poster=imageUrl;preview.src='../微信淘房小程序/报告视频示例.mp4';preview.controls=true}else{preview.src=imageUrl;preview.alt='素材预览'}
  byId('detailPreview').replaceChildren(preview);
  const fields=[['素材名称',assetName(asset)],['角色 ID',asset.roleId],['姓名',asset.name],['素材类型',asset.type],['上传场景',asset.source],['上传时间',asset.time],['使用状态',usageStatus(asset)]];
  if(ReportPrototype.isDeleted(assetRef(asset)))fields.push(['删除时间',new Date(ReportPrototype.deletedAt(assetRef(asset))).toLocaleString('zh-CN')]);
  const metadata=originalFileInfo(asset);
  const sourceFields=[['原始文件名',metadata.fileName],['文件格式',metadata.format],['文件大小',metadata.size],['分辨率',metadata.resolution],...(asset.type==='视频'?[['视频时长',metadata.duration]]:[]),['拍摄时间',metadata.capturedAt],['拍摄设备',metadata.device],['拍摄位置（原始经纬度）',metadata.location]];
  const row=([label,value])=>{const item=make('div','kv');item.append(make('span','',label),make('b','',value||'未记录'));return item};
  byId('detailFields').replaceChildren(...fields.map(row),make('h3','detail-fields-title','原文件信息'),...sourceFields.map(row));
}
const configDefaults = {
  help: '<p>常用的房源照片、讲解视频，可以先放进「我的素材」。上传后，组报告时随时能用。</p><p>在「我的报告」整理好客户关心的内容，和客户聊天时，从「发送资料」挑素材或报告发给他。</p>',
  notice: '<p>请确认上传内容真实、合法且具有使用权。请勿上传侵权或违法内容。</p>'
};
let configKind = 'help';
const configDrafts = {};

function safeRich(html) {
  const template = document.createElement('template');
  template.innerHTML = html;
  const allowed = new Set(['P', 'DIV', 'BR', 'B', 'STRONG', 'I', 'EM', 'UL', 'OL', 'LI', 'A']);
  const walk = node => {
    for (const child of [...node.children]) {
      if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'SVG'].includes(child.tagName)) {
        child.remove();
        continue;
      }
      walk(child);
      if (!allowed.has(child.tagName)) {
        child.replaceWith(...child.childNodes);
        continue;
      }
      const href = child.tagName === 'A' ? child.getAttribute('href') : null;
      for (const attr of [...child.attributes]) child.removeAttribute(attr.name);
      if (href && /^https?:\/\//i.test(href)) {
        child.setAttribute('href', href);
        child.setAttribute('target', '_blank');
        child.setAttribute('rel', 'noopener noreferrer');
      }
    }
  };
  walk(template.content);
  return template.innerHTML;
}

function configKey(kind) { return 'smallb-config-' + kind; }

function switchConfig(kind) {
  if (!canUse('config')) return;
  configKind = kind;
  for (const tab of document.querySelectorAll('[data-config-kind]')) {
    tab.classList.toggle('on', tab.dataset.configKind === kind);
  }
  const isHelp = kind === 'help';
  byId('configTitle').textContent = isHelp ? '功能说明' : '365有客App素材免责须知';
  byId('configTip').textContent = isHelp
    ? '安家顾问在有客 App 的资料库查看。'
    : '安家顾问在组装报告页查看。';
  let saved = configDefaults[kind];
  try { saved = localStorage.getItem(configKey(kind)) || saved; } catch {}
  byId('configEditor').innerHTML = safeRich(configDrafts[kind] ?? saved);
  byId('configPreview').hidden = true;
}

function previewConfig() {
  if (currentPage !== 'config' || !canUse('config')) return;
  byId('configPreview').innerHTML = safeRich(byId('configEditor').innerHTML);
  byId('configPreview').hidden = false;
}

for (const city of access.cities) citySelect.add(new Option(city, city));
citySelect.hidden = !access.cities.length;
citySelect.addEventListener('change', () => {
  for (const page of ['library', 'reports']) {
    byId(page + 'Filters').reset();
    search[page] = {};
  }
  if (currentPage !== 'config') showPage(currentPage);
});

for (const page of ['library', 'reports']) {
  const form = byId(page + 'Filters');
  form.addEventListener('submit', event => {
    event.preventDefault();
    search[page] = Object.fromEntries([...new FormData(form)].map(([key, value]) => [key, value.trim()]));
    renderList(page);
  });
  form.addEventListener('reset', () => {
    search[page] = {};
    renderList(page);
  });
}
byId('backToList').addEventListener('click', () => showPage(currentPage));
for (const button of document.querySelectorAll('[data-config-kind]')) {
  button.addEventListener('click', () => switchConfig(button.dataset.configKind));
}
for (const button of document.querySelectorAll('[data-format]')) {
  button.addEventListener('mousedown', event => event.preventDefault());
  button.addEventListener('click', () => {
    if (currentPage !== 'config' || !canUse('config')) return;
    const command = button.dataset.format;
    byId('configEditor').focus();
    const value = command === 'createLink' ? prompt('输入链接地址') : null;
    if (command === 'createLink' && !/^https?:\/\//i.test(value || '')) return;
    document.execCommand(command, false, value);
  });
}
byId('configEditor').addEventListener('input', event => {
  if (currentPage === 'config' && canUse('config')) configDrafts[configKind] = event.target.innerHTML;
});
byId('previewConfig').addEventListener('click', previewConfig);
byId('saveConfig').addEventListener('click', () => {
  if (currentPage !== 'config' || !canUse('config')) return;
  const html = safeRich(byId('configEditor').innerHTML);
  const template = document.createElement('template');
  template.innerHTML = html;
  if (!template.content.textContent.trim()) {
    alert('请填写内容');
    return;
  }
  try {
    localStorage.setItem(configKey(configKind), html);
    delete configDrafts[configKind];
    byId('configEditor').innerHTML = html;
    previewConfig();
    alert('已保存，对所有城市生效');
  } catch {
    alert('保存失败，请重试');
  }
});

function route() {
  const requested = location.hash.slice(1);
  showPage(Object.hasOwn(pageNames, requested) ? requested : access.cities.length ? 'library' : 'config');
}
window.addEventListener('hashchange', route);
ReportPrototype.onAvailabilityChange(() => {
  if (currentPage !== 'library') return;
  if (currentAsset) openDetail(currentAsset.id);
  else renderList(currentPage);
});
route();
</script>
